<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#0a0f1e"/>
  <!-- Bike wheels -->
  <circle cx="30" cy="68" r="16" fill="none" stroke="#10b981" stroke-width="4"/>
  <circle cx="70" cy="68" r="16" fill="none" stroke="#10b981" stroke-width="4"/>
  <circle cx="30" cy="68" r="3" fill="#10b981"/>
  <circle cx="70" cy="68" r="3" fill="#10b981"/>
  <!-- Frame -->
  <line x1="30" y1="68" x2="50" y2="40" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="40" x2="70" y2="68" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="30" y1="68" x2="50" y2="52" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="40" x2="62" y2="52" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <!-- Handlebar -->
  <line x1="46" y1="40" x2="56" y2="40" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <!-- HR pulse line -->
  <polyline points="12,25 22,25 26,15 31,32 36,20 40,25 50,25 52,18 55,30 58,25 88,25"
    fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
